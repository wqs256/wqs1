{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话测试 - 个人助理与生活服务系统</title>
    <script src="{% static 'js/jquery.js' %}"></script>
    <script src="{% static 'js/vue.min.js' %}"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 800px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 26px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .header-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            color: white;
        }

        .test-section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .test-section button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        .test-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .test-section .result {
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            min-height: 50px;
            color: #333;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .test-section h3 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container" id="app01">
    <div class="header">
        <div class="header-icon">🧪</div>
        <h1>对话功能测试</h1>
        <p>用于测试各种对话功能的调试页面</p>
    </div>

    <div class="test-section">
        <h3>📝 数据替换测试</h3>
        <button @click="send_data">发送数据_数据替换</button>
        <div class="result">[[msg]]</div>
    </div>

    <div class="test-section">
        <h3>🤖 假数据测试</h3>
        <button @click="send_data1">发送数据_假数据</button>
        <div class="result">[[msg1]]</div>
    </div>

    <div class="test-section">
        <h3>🧠 大模型测试</h3>
        <button @click="send_data2">发送数据_大模型</button>
        <div class="result">[[msg2]]</div>
    </div>

    <div class="test-section">
        <h3>🤖 智能体测试</h3>
        <button @click="send_data3">发送数据_智能体</button>
        <div class="result">[[msg3]]</div>
    </div>

    <a href="/login/" class="back-link">← 返回登录页</a>
</div>

<script>
    new Vue({
        delimiters: ['[[', ']]'],
        el:"#app01",
        data:{
            msg:"666",
            msg1:"",
            msg2:"",
            msg3:""
        },
        methods:{
            send_data(){
                this.msg="你好"
            },
            async send_data1(){
                let url="/chat_stream/?q=你是谁？"
                let res=await fetch(url)
                console.log(res)
                let reader=res.body.getReader()
                let decoder=new TextDecoder("utf-8")
                while(true){
                    let data1=await reader.read()
                    if (data1.done){
                        break
                    }
                    let data1_test=decoder.decode(data1.value,{stream:true})
                    this.msg1=this.msg1+data1_test
                }
            },
            async send_data2(){
                let url="/chat_stream_llm/?q=你是谁？"
                let res=await fetch(url)
                console.log(res)
                let reader=res.body.getReader()
                let decoder=new TextDecoder("utf-8")
                while(true){
                    let data1=await reader.read()
                    if (data1.done){
                        break
                    }
                    let data1_test=decoder.decode(data1.value,{stream:true})
                    this.msg2=this.msg2+data1_test
                }
            },
            async send_data3(){
                let url="/chat_agent/?q=贵阳今天天气怎么样？"
                let res=await fetch(url)
                console.log(res)
                let reader=res.body.getReader()
                let decoder=new TextDecoder("utf-8")
                while(true){
                    let data1=await reader.read()
                    if (data1.done){
                        break
                    }
                    let data1_test=decoder.decode(data1.value,{stream:true})
                    this.msg3=this.msg3+data1_test
                }
            }
        }
    })
</script>
</body>
</html>
