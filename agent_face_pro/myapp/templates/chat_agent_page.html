{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体对话 - 个人助理与生活服务系统</title>
    <script src="{% static 'js/jquery.js' %}"></script>
    <script src="{% static 'js/vue.min.js' %}"></script>
    <script src="{% static 'js/marked.min.js' %}"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #app {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
        }

        #sidebar {
            width: 300px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        #sidebar h1 {
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
        }

        .sidebar-buttons {
            margin-bottom: 20px;
        }

        .sidebar-buttons button {
            width: 100%;
            padding: 12px 20px;
            border-radius: 15px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .sidebar-buttons button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
        }

        .history-list-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 500;
            opacity: 0.9;
        }

        .history-item {
            padding: 12px 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .history-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }

        .history-item.active {
            background: rgba(255,255,255,0.3);
            border: 2px solid rgba(255,255,255,0.5);
        }

        .history-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .history-text {
            flex: 1;
            font-size: 14px;
            color: white;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-delete {
            color: #ff6b6b;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .history-delete:hover {
            opacity: 1;
        }

        .history-empty {
            text-align: center;
            color: rgba(255,255,255,0.6);
            padding: 30px;
            font-size: 14px;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }

        .header-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 30px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            gap: 20px;
        }

        .username {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
        }

        .logout-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(238, 90, 36, 0.3);
        }

        #chat_box {
            height: 600px;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            color: #667eea;
            padding: 15px;
            font-size: 18px;
        }

        .message {
            margin-bottom: 20px;
        }

        .message-user {
            display: flex;
            justify-content: flex-end;
        }

        .message-agent {
            display: flex;
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 75%;
            padding: 16px 22px;
            border-radius: 20px;
            word-wrap: break-word;
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 16px;
        }

        .message-user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message-agent .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 6px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }

        .message-agent .message-bubble h1,
        .message-agent .message-bubble h2,
        .message-agent .message-bubble h3,
        .message-agent .message-bubble h4,
        .message-agent .message-bubble h5,
        .message-agent .message-bubble h6 {
            margin: 12px 0 8px 0;
            font-weight: 600;
            line-height: 1.4;
        }

        .message-agent .message-bubble h1 { font-size: 22px; }
        .message-agent .message-bubble h2 { font-size: 20px; }
        .message-agent .message-bubble h3 { font-size: 18px; }
        .message-agent .message-bubble h4 { font-size: 16px; }

        .message-agent .message-bubble p {
            margin: 8px 0;
            line-height: 1.8;
        }

        .message-agent .message-bubble ul,
        .message-agent .message-bubble ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message-agent .message-bubble li {
            margin: 4px 0;
            line-height: 1.6;
        }

        .message-agent .message-bubble code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            color: #e83e8c;
        }

        .message-agent .message-bubble pre {
            background: #282c34;
            color: #abb2bf;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-agent .message-bubble pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: 14px;
        }

        .message-agent .message-bubble blockquote {
            border-left: 4px solid #667eea;
            padding: 8px 16px;
            margin: 12px 0;
            background: #f8f9fa;
            border-radius: 0 8px 8px 0;
            color: #666;
        }

        .message-agent .message-bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }

        .message-agent .message-bubble th,
        .message-agent .message-bubble td {
            border: 1px solid #e0e0e0;
            padding: 8px 12px;
            text-align: left;
        }

        .message-agent .message-bubble th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .message-agent .message-bubble a {
            color: #667eea;
            text-decoration: none;
        }

        .message-agent .message-bubble a:hover {
            text-decoration: underline;
        }

        .message-agent .message-bubble hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 16px 0;
        }

        .message-agent .message-bubble strong {
            font-weight: 600;
        }

        .message-agent .message-bubble em {
            font-style: italic;
        }

        .message-name {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .message-user .message-name {
            text-align: right;
            margin-right: 8px;
        }

        .message-agent .message-name {
            text-align: left;
            margin-left: 8px;
        }

        .input-container {
            display: flex;
            padding: 25px 30px;
            background: white;
            gap: 12px;
        }

        .input-container input {
            flex: 1;
            padding: 15px 22px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            outline: none;
            font-size: 17px;
        }

        .input-container button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 17px;
            font-weight: 500;
        }

        button:disabled {
            background: #ccc !important;
            cursor: not-allowed !important;
        }
    </style>
</head>

<body>
<div id="app">
    <div id="sidebar">
        <h1>🤖 智能体对话</h1>
        <div class="sidebar-buttons">
            <button @click="newChat">➕ 新建对话</button>
        </div>
        <div class="history-list">
            <div class="history-list-title">📜 历史对话</div>
            <div v-if="chatHistory.length === 0" class="history-empty">暂无历史会话</div>
            <div v-for="(session, index) in chatHistory"
                 :class="['history-item', currentSessionIndex === index ? 'active' : '']"
                 @click="loadHistory(index)">
                <div class="history-icon">💬</div>
                <div class="history-text">[[ session.title ]]</div>
                <span class="history-delete" @click.stop="deleteHistory(index)">✕</span>
            </div>
        </div>
    </div>

    <div id="main-content" data-username="{{ username }}">
        <div class="header-bar">
            <span class="username">{{ username }}</span>
            <button class="logout-btn" onclick="window.location.href='/login/'">退出</button>
        </div>
        <div id="chat_box">
            <div v-for="msg in messages"
                 :class="['message', msg.name === '用户' ? 'message-user' : 'message-agent']">
                <div class="message-name">[[ msg.name ]]</div>
                <div class="message-bubble" v-html="msg.name === '用户' ? msg.text : renderMarkdown(msg.text)"></div>
            </div>

            <div class="loading" v-if="isLoading">智能体正在思考中...</div>
        </div>

        <div class="input-container">
            <input
                type="text"
                v-model="userInput"
                @keyup.enter="sendMsg"
                placeholder="请输入您的问题..."
            >
            <button @click="sendMsg" :disabled="!userInput.trim() || isLoading">发送</button>
        </div>
    </div>
</div>

<script>
$(function(){
    // 从 DOM 的 data 属性获取用户名
    const mainContent = document.getElementById('main-content');
    const username = mainContent ? mainContent.getAttribute('data-username') : '默认用户';
    const storageKey = "chatHistory_" + username;
    
    // 强制清除旧的全局存储数据
    if (localStorage.getItem("chatHistoryList")) {
        console.log("清除旧的全局历史记录");
        localStorage.removeItem("chatHistoryList");
    }
    
    console.log("========== 用户隔离存储 ==========");
    console.log("用户名:", username);
    console.log("存储Key:", storageKey);
    console.log("所有localStorage keys:", Object.keys(localStorage));
    console.log("===================================");

    new Vue({
        delimiters: ['[[', ']]'],
        el: "#app",
        data: {
            messages: [],
            userInput: "",
            isLoading: false,
            chatHistory: [],
            currentSessionIndex: -1,
            username: username,
            storageKey: storageKey
        },
        created() {
            console.log("正在加载历史记录，Key:", storageKey);
            const saved = localStorage.getItem(storageKey);
            if (saved) {
                this.chatHistory = JSON.parse(saved);
                console.log("已加载", this.chatHistory.length, "条历史记录");
            } else {
                console.log("无历史记录");
            }
        },
        methods: {
            renderMarkdown(text) {
                if (!text) return '';
                try {
                    return marked.parse(text, { breaks: true, gfm: true });
                } catch (e) {
                    return text;
                }
            },

            cleanToolData(text) {
                if (!text) return '';
                if (text.includes("'type': 'text'") && text.includes("'id': 'lc_")) {
                    return '';
                }
                if (text.includes('"type": "text"') && text.includes('"id": "lc_')) {
                    return '';
                }
                const pattern = /\[\{[^]]*?'type':\s*'text'[^]]*?'id':\s*'lc_[^']*'[^]]*?\}\]/gs;
                let cleaned = text.replace(pattern, '');
                cleaned = cleaned.replace(/\[\{[^]]*?"type":\s*"text"[^]]*?"id":\s*"lc_[^"]*"[^]]*?\}\]/gs, '');
                return cleaned.trim();
            },

            async sendMsg() {
                if (this.userInput.trim() === "" || this.isLoading) return;

                const question = this.userInput.trim();
                this.userInput = "";

                this.messages.push({ name: "用户", text: question });
                this.isLoading = true;

                const agentMsg = { name: "智能体", text: "" };
                this.messages.push(agentMsg);

                try {
                    const url = `/chat_agent/?q=` + encodeURIComponent(question);
                    const es = new EventSource(url);

                    es.onmessage = (event) => {
                        const data = event.data;
                        if (data === '[DONE]') {
                            es.close();
                            this.isLoading = false;
                            this.saveNewSession();
                            return;
                        }
                        const cleanedData = this.cleanToolData(data || '');
                        if (cleanedData) {
                            agentMsg.text += cleanedData;
                            this.$nextTick(() => {
                                const box = document.getElementById('chat_box');
                                box.scrollTop = box.scrollHeight;
                            });
                        }
                    };

                    es.onerror = (err) => {
                        console.log("流已正常结束");
                        es.close();
                        this.isLoading = false;
                    };

                    es.onclose = () => {
                        this.isLoading = false;
                    };

                } catch (e) {
                    agentMsg.text = "连接出错：" + e.message;
                    this.isLoading = false;
                }
            },

            saveNewSession() {
                if (this.messages.length === 0) return;
                const first = this.messages.find(m => m.name === "用户");
                if (!first) return;

                let title = first.text.length > 20 ? first.text.slice(0,20)+"..." : first.text;
                const newSession = {
                    title: title,
                    messages: [...this.messages],
                    id: Date.now()
                };
                this.chatHistory.unshift(newSession);
                this.currentSessionIndex = 0;

                if (this.chatHistory.length > 10) this.chatHistory.pop();
                localStorage.setItem(storageKey, JSON.stringify(this.chatHistory));
            },

            toggleHistoryModal() {
                this.showHistoryModal = !this.showHistoryModal;
            },

            loadHistory(index) {
                this.messages = [...this.chatHistory[index].messages];
                this.currentSessionIndex = index;
                this.$nextTick(() => {
                    const box = document.getElementById('chat_box');
                    box.scrollTop = box.scrollHeight;
                });
            },

            deleteHistory(index) {
                if (confirm("确定删除？")) {
                    this.chatHistory.splice(index, 1);
                    if (this.currentSessionIndex === index) {
                        this.messages = [];
                        this.currentSessionIndex = -1;
                    } else if (this.currentSessionIndex > index) {
                        this.currentSessionIndex--;
                    }
                    localStorage.setItem(storageKey, JSON.stringify(this.chatHistory));
                }
            },

            newChat() {
                if (this.messages.length > 0 && !confirm("确定新建对话？当前会自动保存")) return;
                this.messages = [];
                this.currentSessionIndex = -1;
            }
        }
    })
})
</script>
</body>
</html>
